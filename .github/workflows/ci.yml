name: Build-Test-Lint-etc (linux)

on: [push]

env:
  PYTHON_VERSION: "3.14.10"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Create virtual environment and install dependencies
        run: |
          python --version
          ./ci/linux/create_venv.sh
          ./ci/linux/install_dev.sh

      - name: Run lint
        run: ./ci/linux/lint.sh

  formatting:
    name: Check on formatting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Create virtual environment and install dependencies
        run: |
          python --version
          ./ci/linux/create_venv.sh
          ./ci/linux/install_dev.sh

      - name: Run check on formatting
        run: ./ci/linux/check_formatting.sh

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: "true"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Create virtual environment and install dependencies
        run: |
          python --version
          ./ci/linux/create_venv.sh
          ./ci/linux/install_dev.sh

      - name: Run unit tests
        run: ./ci/linux/test_unit.sh

      - name: Surface failing tests
        if: always()
        uses: pmeier/pytest-results-action@main
        with:
          path: test-results.xml
          summary: true
          display-options: fEX
          fail-on-empty: true

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Create virtual environment and install dependencies
        run: |
          python --version
          ./ci/linux/create_venv.sh
          ./ci/linux/install_dev.sh

      - name: Add mypy annotator
        uses: pr-annotators/mypy-pr-annotator@v1.0.0

      - name: Run typechecker
        run: ./ci/linux/typecheck.sh

  build:
    name: Build the Python package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Create virtual environment and install dependencies
        run: |
          python --version
          ./ci/linux/create_venv.sh
          ./ci/linux/install_dev.sh

      - name: Build
        run: ./ci/linux/build_python_package.sh